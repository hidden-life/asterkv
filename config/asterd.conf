# AsterKV server configuration example.
#
# All options are optional.
# Missing options use built-in defaults.

listen = 127.0.0.1:7721
max_clients = 128
idle_timeout_seconds = 300
log_level = info

# Optional write-ahead log file.
# When configured, asterd replays this WAL file on startup and appends SET/DEL mutations to it.
# This is a foundation feature and does not yet provide production durability guarantees.
#
# wal_file = ./data/asterkv.wal
